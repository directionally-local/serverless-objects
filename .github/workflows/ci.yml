name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (Node.js 22)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          check-latest: true
          cache: npm
      - run: npm ci
      - run: npm test
      # Fails when the cell executor's default autopilot-ai version falls a
      # major release behind npm (the bridge protocol may have changed), and
      # warns when it falls more than a minor release behind.
      - name: Autopilot default package is current
        run: node scripts/check-autopilot-default.mjs
      - run: npm run test:wrangler --workspace=sobjects-conformance
      - run: npm run test:native --workspace=sobjects-conformance
      - run: npm run test:native --workspace=sobjects-conformance -- --native-threads 3

  docker:
    name: Docker image (linux/amd64)
    # A release PR pins a version that is published only once it merges; the
    # push to main checks the image then.
    if: ${{ !startsWith(github.head_ref, 'release-please--') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # A release commit bumps the image's pin before release-please.yml has
      # published that version, so wait for it rather than fail.
      - name: Wait for the pinned version on npm
        run: |
          version=$(sed -n 's/^ARG SOBJECTS_VERSION=//p' deploy/compose/Dockerfile)
          for attempt in $(seq 1 90); do
            npm view "serverless-objects@$version" version --prefer-online >/dev/null 2>&1 && exit 0
            [ "$attempt" = 1 ] && echo "serverless-objects@$version is not on npm yet; waiting for the release to publish it."
            sleep 10
          done
          echo "::error::serverless-objects@$version was not published within 15 minutes; check the publish-npm job in release-please.yml."
          exit 1
      - run: docker build -t serverless-objects:ci deploy/compose
      - name: The CLI and the pinned celld run in the image
        run: |
          docker run --rm serverless-objects:ci --version
          docker run --rm --entrypoint celld serverless-objects:ci --version
          docker run --rm --entrypoint id serverless-objects:ci -u | grep -qx 999
