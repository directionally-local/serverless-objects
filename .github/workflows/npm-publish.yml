name: Publish to npm

# Publishes the CLI package from a release tag. Release Please calls this after
# it creates a release; run it by hand to publish an existing tag.
on:
  workflow_call:
    inputs:
      tag:
        type: string
        required: true
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish, for example serverless-objects-v0.1.0
        type: string
        required: true

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-publish-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish serverless-objects
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      # Trusted publishing (OIDC) needs npm 11.5.1 or newer.
      - run: npm install --global npm@11
      - run: npm ci
      - run: npm test
      - name: Check the tag matches the package version
        env:
          TAG: ${{ inputs.tag }}
        run: |
          version=$(node -p 'require("./packages/cli/package.json").version')
          if [ "$TAG" != "serverless-objects-v$version" ]; then
            echo "Tag $TAG does not match packages/cli version $version" >&2
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - name: Publish unless this version is already on npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if npm view "serverless-objects@$VERSION" version >/dev/null 2>&1; then
            echo "serverless-objects@$VERSION is already published"
            exit 0
          fi
          npm publish --workspace=serverless-objects --provenance --access public
