name: Release Please

# npm trusted publishing matches this file's name, so every publish, automatic
# or manual, runs from here.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to publish, for example serverless-objects-v0.1.0
        type: string
        required: true

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release-please-${{ github.ref }}
  # Queue rather than cancel, so a publish is never interrupted.
  cancel-in-progress: false

jobs:
  release-please:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      cli_release_created: ${{ steps.release.outputs['packages/cli--release_created'] }}
      cli_tag: ${{ steps.release.outputs['packages/cli--tag_name'] }}
    steps:
      - id: release
        uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # A release created with GITHUB_TOKEN does not trigger other workflows, so
  # publishing runs here, after a new CLI release or from a manual dispatch.
  publish-npm:
    needs: release-please
    if: >-
      always() &&
      (needs.release-please.outputs.cli_release_created == 'true' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    env:
      TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || needs.release-please.outputs.cli_tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      # Trusted publishing (OIDC) needs npm 11.5.1 or newer.
      - run: npm install --global npm@11
      - run: npm ci
      - run: npm test
      - name: Check the tag matches the package version
        run: |
          version=$(node -p 'require("./packages/cli/package.json").version')
          if [ "$TAG" != "serverless-objects-v$version" ]; then
            echo "Tag $TAG does not match packages/cli version $version" >&2
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - name: Publish unless this version is already on npm
        run: |
          if npm view "serverless-objects@$VERSION" version >/dev/null 2>&1; then
            echo "serverless-objects@$VERSION is already published"
            exit 0
          fi
          npm publish --workspace=serverless-objects --provenance --access public
