name: Release Please

# npm trusted publishing matches this file's name, so every publish, automatic
# or manual, runs from here.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to publish, for example serverless-objects-v0.1.2 or hotcell-v0.1.0
        type: string
        required: true

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release-please-${{ github.ref }}
  # Queue rather than cancel, so a publish is never interrupted.
  cancel-in-progress: false

jobs:
  release-please:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      releases_created: ${{ steps.release.outputs.releases_created }}
      release_outputs: ${{ toJSON(steps.release.outputs) }}
    steps:
      - id: release
        uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # A release created with GITHUB_TOKEN does not trigger other workflows, so
  # publishing runs here, after new releases or from a manual dispatch.
  # .github/scripts/publish.mjs decides what to publish.
  publish-npm:
    needs: release-please
    if: >-
      always() &&
      (needs.release-please.outputs.releases_created == 'true' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.sha }}
      # The publish script always comes from the commit that runs this
      # workflow, so publishing an older tag uses the current script.
      - uses: actions/checkout@v4
        with:
          path: .ci
          sparse-checkout: .github/scripts
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          check-latest: true
          cache: npm
          registry-url: https://registry.npmjs.org
      # Trusted publishing (OIDC) needs npm 11.5.1 or newer.
      - run: npm install --global npm@11
      - run: npm ci
      - run: npm test
      - run: node .ci/.github/scripts/publish.mjs
        env:
          RELEASE_OUTPUTS: ${{ needs.release-please.outputs.release_outputs }}
          DISPATCH_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || '' }}
