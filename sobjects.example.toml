# Single-node celld settings for `sobjects up`. To run the native engine
# instead, replace [celld] with a [native] table (see docs/native-engine.md):
# [native]
# project = "./my-worker"
# listen = "127.0.0.1:8787"
# [native.backup]
# bucket = "s3://replace-with-your-bucket/app"

# Keep the listener on loopback unless a TLS-terminating ingress is in front.
[celld]
bucket = "s3://replace-with-your-bucket/serverless-objects"
listen = "127.0.0.1:8080"

# Optional S3-compatible endpoint and region:
# endpoint = "https://account.example-storage.com"
# region = "auto"

# Optional TLS ingress in front of celld, started by `sobjects up`.
# Relative paths resolve from this file's directory. Without [ingress.tls],
# the ingress may only listen on loopback.
# [ingress]
# listen = "0.0.0.0:443"
# redirect_http = "0.0.0.0:80"
# access_log = "-"  # "-" writes JSON lines to stdout; default is the state directory
#
# [ingress.tls]
# cert = "/etc/serverless-objects/tls/fullchain.pem"
# key = "/etc/serverless-objects/tls/privkey.pem"
#
# [[ingress.routes]]
# hostname = "agents.example.com"
# # upstream defaults to the [celld] listener

# Or use HTTP-01 ACME instead of [ingress.tls]. ACME requires public traffic on
# port 80 to reach redirect_http; test against staging before using production.
# [ingress.acme]
# email = "ops@example.com"
# agree_to_terms = true  # Explicitly agree to the CA subscriber terms.
# directory_url = "https://acme-staging-v02.api.letsencrypt.org/directory"
#
# [[ingress.routes]]
# hostname = "agents.example.com"  # HTTP-01 does not issue wildcard certificates.
# # upstream defaults to the [celld] listener
#
# Optional loopback admin API and Prometheus metrics, served by the supervisor.
# Enabling it pins celld's operator listener (default: [celld] port + 1).
# The API needs the admin token from the state directory; run
# `sobjects dashboard` for a dashboard URL that carries it.
# [admin]
# listen = "127.0.0.1:8790"
